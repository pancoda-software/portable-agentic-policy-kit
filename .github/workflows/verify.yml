name: Verify policy kit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source policy
        run: python3 tooling/validate.py
      - name: Run unit and security tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate rendering
        run: |
          mkdir -p "$RUNNER_TEMP/policy-render"
          python3 tooling/render.py --config templates/project.yaml --out "$RUNNER_TEMP/policy-render"
          python3 tooling/validate.py --config templates/project.yaml --generated "$RUNNER_TEMP/policy-render"
